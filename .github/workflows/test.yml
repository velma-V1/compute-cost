name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        shell: pwsh
        run: python -m pip install --upgrade pip; python -m pip install -e ".[test]"
      - name: Test
        shell: pwsh
        run: python -m pytest
